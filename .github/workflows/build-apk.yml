name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-apk.yml'

# 发版只走手动 dispatch；push 触发仅限本工作流文件自身变化，目的是验证
# 工作流改动本身（跑一次真实构建），正常发版不要依赖它。

# 最小权限说明：contents:write 仅用于末尾 Create Release 步骤创建 Release；其余步骤只读。
permissions:
  contents: write

# L1：同一时间只跑一个发版构建；进行中的发版不取消（避免 Release 写一半），
# 后触发的排队等待。
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  direct_build:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    # L1：构建任务加超时（默认 360 分钟，Gradle 挂起会烧 6 小时 runner）。
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # H1 fail-closed：签名 Secret 缺失时直接失败，绝不静默出 debug 签名包。
      # （Secret 值不打印，只检查是否为空。）
      - name: Check release signing secrets
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secret(s):$missing — see docs/release-signing.md"
            exit 1
          fi
          echo "All 4 release signing secrets are set."
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "zulu"
          java-version: "17"

      # M5：缓存 Gradle 发行版与依赖（此前只缓存 yarn，每次重下全部依赖）。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # M1：发版时以 package.json 为准，把版本号与 versionCode 同步进 app.json
      # （只改 runner 内文件，不提交），防止提交时忘了同步导致 APK 版本号漂移。
      - name: Sync app.json version from package.json
        run: node scripts/sync-version.js sync

      # M5：这里是唯一一次 prebuild。`yarn build` 内部就是
      # `yarn prebuild && gradlew assembleRelease`，且 prebuild 带 --clean 会删掉
      # 前一次的全部产物——旧流程先单独跑 `yarn prebuild` 再跑 `yarn build`，
      # 第一次 prebuild 被完整浪费。所以这里拆成 prebuild 与 gradle 两步，
      # 中间正好插入 keystore 还原。
      - name: Prebuild TV App
        run: yarn prebuild

      # H1：从 Secret 还原 release keystore，并验证 keystore、密码、别名都对
      # （有问题在这里就失败，不等 5 分钟 Gradle 构建跑完才发现）。
      # 同时确认 config plugin 已把签名配置注入生成的 build.gradle。
      - name: Restore release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          chmod 600 android/app/release.keystore
          keytool -list -keystore android/app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS"
          grep -q 'ORIONTV_RELEASE_STORE_FILE' android/app/build.gradle \
            || { echo "::error::Release signing was not injected into android/app/build.gradle (withReleaseSigning plugin)"; exit 1; }
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # 签名配置经 ORG_GRADLE_PROJECT_* 环境变量传给 Gradle（即 Gradle 项目
      # 属性，config plugin 注入的 signingConfig 从这里读）；用环境变量而不用
      # 写 gradle.properties 文件，是为了避免密码里的特殊字符被 properties
      # 语法误解析。
      - name: Build TV APK
        run: cd android && ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_ORIONTV_RELEASE_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_ORIONTV_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ORIONTV_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ORIONTV_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # H1 fail-closed：确认 APK 不是 debug key 签的（证书主题含 Android Debug 即失败）。
      # 注意：per-ABI splits（plugins/withApkSplits.js）开启后，通用包的文件名是
      # app-universal-release.apk（不是 app-release.apk）；发版只上传通用包。
      - name: Verify APK is not debug-signed
        run: |
          APK="android/app/build/outputs/apk/release/app-universal-release.apk"
          keytool -printcert -jarfile "$APK" > /tmp/apk-cert.txt
          grep -i 'Owner:' /tmp/apk-cert.txt | head -1
          if grep -qi 'Android Debug' /tmp/apk-cert.txt; then
            echo "::error::APK is signed with the Android debug key — release signing did not apply."
            exit 1
          fi
          echo "APK is signed with a non-debug certificate."

      - name: Rename APK file
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-universal-release.apk artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk

      - name: Generate SHA256 checksum
        run: |
          cd artifacts
          sha256sum orionTV.${{ steps.package-version.outputs.version }}.apk > orionTV.${{ steps.package-version.outputs.version }}.apk.sha256
          cat orionTV.${{ steps.package-version.outputs.version }}.apk.sha256

      - name: Create Release and Upload APK
        # 只在手动 dispatch 时发版：push 触发（改本工作流文件时）只验证构建，
        # 不得覆盖已发布 Release——action-gh-release 会更新同 tag 的 Release
        # 并替换附件、重置正文，会抹掉人工补的“已装旧版需先卸载再安装”警告。
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: Release v${{ steps.package-version.outputs.version }}
          body: Automated release for version v${{ steps.package-version.outputs.version }}.
          draft: false
          prerelease: false
          files: |
            artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk
            artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # L1：Release 步骤失败时 APK 仍可取（Actions Artifacts 兜底）。
      - name: Upload APK artifact (fallback)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oriontv-apk-fallback
          path: artifacts/
          if-no-files-found: warn
