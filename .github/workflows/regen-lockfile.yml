# TEMPORARY — SDK 58 migration scaffolding only. Regenerates yarn.lock
# from package.json on this branch (yarn 1 cannot reach the registry
# from the migration sandbox) and uploads it as an artifact.
# DELETE BEFORE MERGING.
name: Regen yarn.lock (temp)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regen:
    name: Regenerate yarn.lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Regenerate lockfile
        run: yarn install --no-progress

      - name: Upload yarn.lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yarn-lock
          path: yarn.lock
          if-no-files-found: error
