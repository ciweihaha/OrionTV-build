name: Regen lockfile (temp)

# 临时工作流：第 106 轮依赖升级时，沙箱无法本地跑 yarn install，
# 由 Runner 根据已更新的 package.json 重新生成 yarn.lock 并推回 master。
# 用完即删，不进常驻工作流。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    name: Sync yarn.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "yarn"

      - name: Sync lockfile with package.json
        run: yarn install

      - name: Commit updated yarn.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          if git diff --cached --quiet; then
            echo "lockfile already in sync"
          else
            git commit -m "第106轮：同步 yarn.lock（依赖升到最新）"
            git push
          fi
